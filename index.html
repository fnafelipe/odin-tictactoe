<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <script src="./script.js" defer></script>
    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="player one">
        <h1>Player 1:</h1>
        <h2>Name: Felipe</h2>
        <h2>Marker: X</h2>
      </div>
      <div class="control"></div>
      <div class="board">
        <div class="spot" data-row="0" data-col="0"></div>
        <div class="spot" data-row="0" data-col="1"></div>
        <div class="spot" data-row="0" data-col="2"></div>
        <div class="spot" data-row="1" data-col="0"></div>
        <div class="spot" data-row="1" data-col="1"></div>
        <div class="spot" data-row="1" data-col="2"></div>
        <div class="spot" data-row="2" data-col="0"></div>
        <div class="spot" data-row="2" data-col="1"></div>
        <div class="spot" data-row="2" data-col="2"></div>
      </div>
      <div class="result">
        <h1>Player 1 wins!</h1>
      </div>
      <div class="player two">
        <h1>Player 2:</h1>
        <h2>Name: Carlos</h2>
        <h2>Marker: O</h2>
      </div>
    </div>
  </body>
</html>
